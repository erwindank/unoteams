  <text x="256" y="420" text-anchor="middle" font-family="Lilita One, Arial Black, sans-serif" font-size="70" letter-spacing="8" fill="#fff" stroke="#1b0d14" stroke-width="12" paint-order="stroke" transform="rotate(-6 256 400)">TEAMS</text>
