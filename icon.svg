      <stop offset="0" stop-color="#c8126c"/><stop offset=".55" stop-color="#74003a"/><stop offset="1" stop-color="#24001a"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g stroke="#1b0d14" stroke-width="12" stroke-linejoin="round">
    <g transform="rotate(-14 190 270)">
